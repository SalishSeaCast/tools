name: "CodeQL"

permissions: {}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '26 16 * * 1'

jobs:
  analyze:
    name: Analyze
    permissions:
      actions: read  # Required to run CodeQL analysis
      contents: read  # Required to access the repository's contents for analysis
      security-events: write  # Required to upload the analysis results to pull requests

    strategy:
      fail-fast: false
      matrix:
        language: [ "python" ]
    uses: UBC-MOAD/gha-workflows/.github/workflows/codeql-analysis.yaml@main  # zizmor: ignore[unpinned-uses]
    with:
      language: ${{ matrix.language }}
