name: pytest-with-coverage

permissions: {}

on:
  push:
    branches: [ '*' ]
  # Enable workflow to be triggered from GitHub CLI, browser, or via API
  # primarily for testing a conda environment solution for new Python versions
  workflow_dispatch:

jobs:
  pytest-with-coverage:
    permissions:
      contents: read  # Required to access the repository's contents for testing
      pull-requests: write  # Required to upload the coverage report to pull requests
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
    uses: UBC-MOAD/gha-workflows/.github/workflows/pytest-with-coverage.yaml@main  # zizmor: ignore[unpinned-uses]
    with:
      python-version: ${{ matrix.python-version }}
      conda-env-file: SalishSeaTools/envs/environment-test.yaml
      conda-env-name: salishsea-tools-test
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
